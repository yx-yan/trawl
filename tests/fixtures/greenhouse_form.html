<!doctype html>
<!-- A stand-in for job-boards.greenhouse.io's form, with the parts trawl relies on: fields by the
     API's names, react-select style comboboxes (options in the listbox named by aria-controls, the
     choice shown in the control, the input left empty), a checkbox group named question_x[], a
     required consent, an "Add another" button for a second school and degree, an email the browser
     checks itself, and a Submit that rejects an unticked
     consent and otherwise thanks you. -->
<html><body>
<p>Thank you for your interest in Example. We build things.</p>
<form id="application-form" onsubmit="return go(event)">
  <label for="first_name">First Name*</label><input id="first_name" aria-required="true">
  <label for="email">Email*</label><input id="email" type="email" aria-required="true">
  <label for="resume">Attach</label><input id="resume" type="file">
  <div class="select__control">
    <label for="question_1">Are you eligible to work in Singapore?*</label>
    <input id="question_1" role="combobox" aria-required="true" data-options="Yes, I am eligible|No, I am not">
  </div>
  <div class="select__control">
    <label for="school--0">School*</label>
    <input id="school--0" role="combobox" aria-required="true"
           data-options="Nanyang Polytechnic (NYP)|Nanyang Technological University (NTU)">
  </div>
  <div id="education"></div>
  <button type="button" onclick="addEducation()">Add another</button>
  <fieldset><legend>When can you start?*</legend>
    <input type="checkbox" id="q2_a" name="question_2[]" aria-required="true"><label for="q2_a">Q2 2027 (April - June)</label>
    <input type="checkbox" id="q2_b" name="question_2[]" aria-required="true"><label for="q2_b">Q3 2027 (July - September)</label>
  </fieldset>
  <label for="question_3">Anything else?</label><textarea id="question_3"></textarea>
  <input type="checkbox" id="consent" aria-required="true"><label for="consent">I consent to Example processing my data*</label>
  <div id="errors"></div>
  <button type="submit">Submit application</button>
</form>
<script>
function wire(input) {
  const list = document.createElement('div');
  list.id = 'react-select-' + input.id + '-listbox';
  input.after(list);
  input.addEventListener('input', () => {
    input.setAttribute('aria-controls', list.id);
    list.innerHTML = '';
    const typed = input.value.toLowerCase();
    for (const text of input.dataset.options.split('|').filter(o => o.toLowerCase().includes(typed))) {
      const opt = document.createElement('div');
      opt.setAttribute('role', 'option');
      opt.innerText = text;
      opt.onclick = () => {
        const ctl = input.closest('.select__control');
        ctl.querySelectorAll('.select__single-value').forEach(e => e.remove());
        const chosen = document.createElement('div');
        chosen.className = 'select__single-value';
        chosen.innerText = text;
        ctl.prepend(chosen);
        input.value = '';
        list.innerHTML = '';
      };
      list.append(opt);
    }
  });
}
document.querySelectorAll('[role=combobox]').forEach(wire);
function addEducation() {  // a second school and degree, as Greenhouse's "Add another" adds them
  document.getElementById('education').innerHTML = `
    <div class="select__control"><label for="school--1">School*</label>
      <input id="school--1" role="combobox" aria-required="true" data-options="Wuhan University|Wuhan University of Technology"></div>
    <div class="select__control"><label for="degree--1">Degree*</label>
      <input id="degree--1" role="combobox" aria-required="true" data-options="Bachelor's Degree|Master's Degree"></div>`;
  document.querySelectorAll('#education [role=combobox]').forEach(wire);
}
function go(event) {
  event.preventDefault();
  if (!document.getElementById('consent').checked) {
    document.getElementById('errors').innerHTML = '<p class="helper-text--error">Please consent to continue</p>';
    return false;
  }
  document.body.innerHTML = '<h1>Thank you for applying.</h1>';
  return false;
}
</script>
</body></html>
