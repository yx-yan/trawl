<!doctype html>
<!-- A stand-in for a jobs.lever.co apply page: labelled standard fields by name, custom questions in
     cards whose hidden baseTemplate holds their JSON definition (radios, checkboxes and a select
     sharing a name), an EEO select, a location autocomplete that must be picked from, and a
     button Submit that checks the required fields and then thanks you. -->
<html><body>
<form id="application-form" action="#" onsubmit="return false">
<ul>
  <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
    <div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label></li>
  <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
    <div class="application-field"><input type="text" name="name" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
    <div class="application-field"><input type="email" name="email" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Current location<span class="required">✱</span></div>
    <div class="application-field"><input type="text" name="location" id="location-input" required>
    <input type="hidden" name="selectedLocation" id="selected-location">
    <div class="dropdown-container"><div class="dropdown-results"></div></div></div></label></li>
  <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
    <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
</ul>
<input type="hidden" name="cards[c1][baseTemplate]" value="{&quot;text&quot;: &quot;Offer deadlines&quot;, &quot;fields&quot;: [{&quot;type&quot;: &quot;multiple-choice&quot;, &quot;text&quot;: &quot;Do you have any upcoming offer deadlines?&quot;, &quot;required&quot;: true, &quot;options&quot;: [{&quot;text&quot;: &quot;Yes&quot;}, {&quot;text&quot;: &quot;No&quot;}]}, {&quot;type&quot;: &quot;multiple-select&quot;, &quot;text&quot;: &quot;Language Skill(s) (Check all that apply)&quot;, &quot;required&quot;: true, &quot;options&quot;: [{&quot;text&quot;: &quot;English (ENG)&quot;}, {&quot;text&quot;: &quot;Mandarin (MAN)&quot;}, {&quot;text&quot;: &quot;Other&quot;}]}]}">
<input type="radio" name="cards[c1][field0]" value="Yes" required> Yes
<input type="radio" name="cards[c1][field0]" value="No" required> No
<input type="checkbox" name="cards[c1][field1]" value="English (ENG)"> English
<input type="checkbox" name="cards[c1][field1]" value="Mandarin (MAN)"> Mandarin
<input type="checkbox" name="cards[c1][field1]" value="Other"> Other
<input type="hidden" name="cards[c2][baseTemplate]" value="{&quot;text&quot;: &quot;University&quot;, &quot;fields&quot;: [{&quot;type&quot;: &quot;dropdown&quot;, &quot;text&quot;: &quot;Which university are you attending?&quot;, &quot;required&quot;: true, &quot;options&quot;: [{&quot;text&quot;: &quot;Nanyang Polytechnic&quot;}, {&quot;text&quot;: &quot;Nanyang Technological University - NTU&quot;}]}, {&quot;type&quot;: &quot;textarea&quot;, &quot;text&quot;: &quot;What excites you about Example?&quot;, &quot;required&quot;: true}]}">
<select name="cards[c2][field0]" required><option value="">Select...</option>
  <option>Nanyang Polytechnic</option><option>Nanyang Technological University - NTU</option></select>
<textarea name="cards[c2][field1]" required></textarea>
<input type="hidden" name="cards[c3][baseTemplate]" value="{&quot;text&quot;: &quot;Singapore&quot;, &quot;fields&quot;: [{&quot;type&quot;: &quot;multiple-choice&quot;, &quot;text&quot;: &quot;Are you a Singapore citizen?&quot;, &quot;required&quot;: true, &quot;options&quot;: [{&quot;text&quot;: &quot;Yes&quot;}, {&quot;text&quot;: &quot;No&quot;}]}, {&quot;type&quot;: &quot;multiple-choice&quot;, &quot;text&quot;: &quot;As part of our interview process, we may use AI notetakers to transcribe interviews.&quot;, &quot;required&quot;: true, &quot;options&quot;: [{&quot;text&quot;: &quot;Yes, I consent&quot;}, {&quot;text&quot;: &quot;No, I do not consent&quot;}]}]}">
<input type="radio" name="cards[c3][field0]" value="Yes" required> Yes
<input type="radio" name="cards[c3][field0]" value="No" required> No
<input type="radio" name="cards[c3][field1]" value="Yes, I consent" required> Yes, I consent
<input type="radio" name="cards[c3][field1]" value="No, I do not consent" required> No
<select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option>
  <option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select>
<textarea name="comments" id="additional-information"></textarea>
<div id="errors"></div>
<button type="button" id="btn-submit" onclick="go()">Submit application</button>
</form>
<script>
const loc = document.getElementById('location-input');
loc.addEventListener('input', () => {
  const box = document.querySelector('.dropdown-results');
  box.innerHTML = ['Singapore, SGP', 'Singapore', 'Singapore, MI, USA']
    .filter(o => o.toLowerCase().includes(loc.value.toLowerCase()))
    .map((o, i) => `<div class="dropdown-location" id="location-${i}">${o}</div>`).join('');
  box.querySelectorAll('.dropdown-location').forEach(d => d.onclick = () => {
    loc.value = d.innerText;
    document.getElementById('selected-location').value = JSON.stringify({name: d.innerText});
    box.innerHTML = '';
  });
});
function go() {
  const picked = name => document.querySelector(`[name="${name}"]:checked`);
  if (!document.getElementById('selected-location').value || !picked('cards[c3][field1]')) {
    document.getElementById('errors').innerHTML = '<div class="error-message">Please complete the required fields</div>';
    return;
  }
  document.body.innerHTML = '<h3>Application submitted!</h3>';
}
</script>
</body></html>
