[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trawl"
version = "0.1.0"
description = "Collects forward-deployed-engineer jobs, tailors applications, and submits only what a human approves."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yuxuan Yan" }]
dependencies = ["httpx>=0.27", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
trawl = "trawl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
